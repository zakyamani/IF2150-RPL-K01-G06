name: Laporan bug
description: Perilaku aplikasi yang tidak sesuai harapan.
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Modul
      options: [Akun, Katalog, Penawaran, Pembayaran demo, Pickup, Notifikasi, Pengaduan, Ulasan, Keuangan demo, Operasi]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Langkah reproduksi
      description: Gunakan akun/data fiktif. Jangan sertakan password atau OTP aktif.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Hasil yang diharapkan dan hasil aktual
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Versi aplikasi, Android dan perangkat
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot atau log yang sudah dibersihkan
