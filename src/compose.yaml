name: sisarasa-academic
x-app: &app
  image: sisarasa-academic-api:local
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  build: ./backend
  env_file: ${SISARASA_ENV_FILE:-.env}
  environment:
    NODE_ENV: production
    MEDIA_DIR: /app/uploads
  volumes:
    - ${MEDIA_PATH:-./uploads}:/app/uploads
  restart: unless-stopped
  init: true
  stop_grace_period: 25s
  mem_limit: 512m
  cpus: 1.0
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp:size=32m,mode=1777"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sisarasa
      POSTGRES_DB: sisarasa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.sh}
    ports: ["127.0.0.1:${DB_HOST_PORT:-55432}:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    restart: unless-stopped
    stop_grace_period: 25s
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisarasa -d sisarasa"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    command: ["node", "dist/scripts/migrate.js"]
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    ports: ["127.0.0.1:${API_HOST_PORT:-3100}:3000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
  worker:
    <<: *app
    command: ["node", "dist/src/worker.js"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');try{const h=JSON.parse(fs.readFileSync('/tmp/sisarasa-worker-heartbeat'));process.exit(Date.now()-Date.parse(h.at)<15000?0:1)}catch{process.exit(1)}"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
volumes:
  database:
